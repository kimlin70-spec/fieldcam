# FieldCam — 안드로이드 APK 자동 빌드
#
# 언제 돌아가나
#   - main 브랜치에 push        → 단위 테스트 + APK 빌드 + 릴리스 "apk-latest" 갱신 (서명 Secrets 가 있을 때만)
#   - claude/** 브랜치에 push   → 단위 테스트 + APK 빌드 + 아티팩트 업로드 (검증용, 릴리스는 안 만듦)
#   - Actions 탭에서 수동 실행 (workflow_dispatch) → main 에서 돌리면 릴리스까지 갱신
#   - README 등 .md 파일만 바뀐 push 는 빌드하지 않는다
#
# 결과물 받는 곳
#   - 릴리스:   https://github.com/kimlin70-spec/fieldcam/releases/download/apk-latest/fieldcam.apk
#   - 아티팩트: Actions → 해당 실행 → Artifacts → fieldcam-apk (zip 안에 fieldcam.apk)
#
# 서명 (저장소 Settings → Secrets and variables → Actions)
#   ANDROID_KEYSTORE_B64      키스토어 파일을 base64 로 인코딩한 문자열
#   ANDROID_KEYSTORE_PASSWORD 키스토어 비밀번호 (키스토어가 있으면 필수)
#   ANDROID_KEY_ALIAS         키 별칭 (없으면 fieldcam)
#   ANDROID_KEY_PASSWORD      키 비밀번호 (없으면 키스토어 비밀번호와 같다고 간주)
#   비밀이 있으면 모든 빌드가 같은 키로 서명되어 새 APK 가 기존 앱 위에 덮어쓰기 설치된다.
#   별칭 비밀이 없으면 키스토어에 개인 키가 하나뿐일 때 그 별칭을 쓴다.
#   비밀이 없으면 그 빌드에서만 쓰는 임시 키로 서명해 빌드와 서명 경로만 검증하고,
#   main 에서도 릴리스는 갱신하지 않고 실패로 끝낸다 (임시 키 APK 는 업데이트마다 지우고 깔아야 해서).
#   어느 쪽이든 같은 경로(keystore.properties)로 서명하고, APK 의 서명 인증서를 그 키와 대조한다.
#   예전 실행을 다시 돌려 릴리스에 있는 것보다 낮은 versionCode 가 나오면 게시하지 않는다.
#
# 버전
#   versionCode = 1000 + 실행 번호, versionName = 1.0.실행번호. 앱 설정 화면 오른쪽 위에 보인다.
#   워크플로 파일 이름을 바꾸면 실행 번호가 1부터 다시 시작하니 이름을 유지할 것.

name: Build Android APK

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write   # 릴리스 생성/갱신, apk-latest 태그 이동에 필요

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}   # main 은 릴리스 교체 중 끊기지 않게

env:
  APK_NAME: fieldcam.apk
  ANDROID_API: '35'        # app/build.gradle.kts 의 compileSdk 와 맞춤
  BUILD_TOOLS: '34.0.0'    # AGP 8.7 기본 build-tools
  JAVA_VERSION: '21'       # PC 의 Android Studio 가 쓰는 Gradle JDK 와 맞춤

jobs:
  build:
    name: APK 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # secrets 는 if 조건에서 직접 쓸 수 없어 env 로 옮겨 존재 여부만 검사한다 (값은 노출되지 않음)
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
        with:
          persist-credentials: true   # 아래 apk-latest 태그 push 에 필요

      - name: JDK ${{ env.JAVA_VERSION }} 설치 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Android SDK 준비 (platform ${{ env.ANDROID_API }}, build-tools ${{ env.BUILD_TOOLS }})
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-${{ env.ANDROID_API }} build-tools;${{ env.BUILD_TOOLS }}

      - name: Gradle 캐시 설정
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 서명 키 준비 (Secrets 의 고정 키, 없으면 이 빌드 전용 임시 키)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KS_PATH="${RUNNER_TEMP}/fieldcam-signing.p12"
          if [ "${HAS_KEYSTORE}" = "true" ]; then
            # 웹 화면에 붙여넣다 끝에 줄바꿈이 섞여도 되도록 줄바꿈을 지운다
            KEYSTORE_PASSWORD="$(printf '%s' "${KEYSTORE_PASSWORD}" | tr -d '\r\n')"
            KEY_PASSWORD="$(printf '%s' "${KEY_PASSWORD}" | tr -d '\r\n')"
            KEY_ALIAS="$(printf '%s' "${KEY_ALIAS}" | tr -d '\r\n')"
            if [ -z "${KEYSTORE_PASSWORD}" ]; then
              echo "::error::ANDROID_KEYSTORE_B64 는 있는데 ANDROID_KEYSTORE_PASSWORD 비밀이 없습니다. 둘 다 넣거나 둘 다 지우세요."
              exit 1
            fi
            # 윈도우 certutil 로 만든 값의 -----BEGIN/END----- 줄과 줄바꿈·공백은 버리고 푼다
            printf '%s\n' "${KEYSTORE_B64}" | tr -d '\r' | sed '/^-----/d' | tr -d '\n\t ' | base64 -d > "${KS_PATH}" \
              || { echo "::error::ANDROID_KEYSTORE_B64 가 올바른 base64 가 아닙니다."; exit 1; }
            if [ ! -s "${KS_PATH}" ]; then
              echo "::error::ANDROID_KEYSTORE_B64 를 풀었더니 비어 있습니다. 값을 다시 넣으세요."
              exit 1
            fi
            SIGNING=release
          else
            # 비밀이 없으면 이 빌드에서만 쓰는 키를 만든다. 서명 경로 전체가 매번 실제로 검증된다.
            KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
            KEY_PASSWORD=""
            KEY_ALIAS="fieldcam"
            keytool -genkeypair -storetype PKCS12 -keystore "${KS_PATH}" -alias fieldcam \
              -keyalg RSA -keysize 2048 -validity 3650 -storepass "${KEYSTORE_PASSWORD}" \
              -dname "CN=FieldCam temporary build key" > /dev/null 2>&1
            SIGNING=temporary
            echo "::warning::저장소 Secrets 에 ANDROID_KEYSTORE_B64 가 없어 이 빌드 전용 임시 키로 서명합니다. main 에서는 릴리스를 갱신하지 않습니다."
          fi
          KEY_PASSWORD="${KEY_PASSWORD:-${KEYSTORE_PASSWORD}}"
          echo "::add-mask::${KEYSTORE_PASSWORD}"
          echo "::add-mask::${KEY_PASSWORD}"
          export KEYSTORE_PASSWORD KEY_PASSWORD

          # AGP 와 같은 방법(KeyStore.load → getKey)으로 키를 열어 본다.
          # 별칭 비밀이 없으면 키스토어에 개인 키가 하나뿐일 때 그 별칭을 쓴다 (Azura 키의 azura, Android Studio 기본 key0 등).
          # 확인되면 대조용 인증서 SHA-256 을 출력한다.
          cat > "${RUNNER_TEMP}/CheckKey.java" <<'JAVA'
          public class CheckKey {
            public static void main(String[] a) throws Exception {
              var ks = java.security.KeyStore.getInstance(java.security.KeyStore.getDefaultType());
              try (var in = new java.io.FileInputStream(a[0])) {
                ks.load(in, System.getenv("KEYSTORE_PASSWORD").toCharArray());
              } catch (Exception e) {
                System.out.println("STORE"); return;
              }
              String alias = a[1];
              if (alias.isEmpty()) {
                var keys = new java.util.ArrayList<String>();
                for (var e = ks.aliases(); e.hasMoreElements();) { var n = e.nextElement(); if (ks.isKeyEntry(n)) keys.add(n); }
                alias = keys.size() == 1 ? keys.get(0) : "fieldcam";
              }
              if (!ks.isKeyEntry(alias)) { System.out.println("ALIAS " + alias); return; }
              try {
                if (ks.getKey(alias, System.getenv("KEY_PASSWORD").toCharArray()) == null) throw new Exception();
              } catch (Exception e) {
                System.out.println("KEYPASS " + alias); return;
              }
              var d = java.security.MessageDigest.getInstance("SHA-256").digest(ks.getCertificate(alias).getEncoded());
              var sb = new StringBuilder();
              for (var b : d) sb.append(String.format("%02x", b));
              System.out.println("OK " + alias + " " + sb);
            }
          }
          JAVA
          CHECK="$(java "${RUNNER_TEMP}/CheckKey.java" "${KS_PATH}" "${KEY_ALIAS}" 2>&1 | grep -E '^(OK|STORE|ALIAS|KEYPASS)' | tail -n 1 || true)"
          rm -f "${RUNNER_TEMP}/CheckKey.java"
          case "${CHECK}" in
            OK\ *) ;;
            STORE*)   echo "::error::키스토어를 열지 못했습니다. ANDROID_KEYSTORE_PASSWORD 가 ANDROID_KEYSTORE_B64 키스토어의 비밀번호인지 확인하세요."; exit 1 ;;
            ALIAS*)   echo "::error::키스토어에 별칭 '${CHECK#ALIAS }' 인 키가 없습니다. ANDROID_KEY_ALIAS 비밀에 맞는 별칭을 넣으세요."; exit 1 ;;
            KEYPASS*) echo "::error::별칭 '${CHECK#KEYPASS }' 키를 열지 못했습니다. 키 비밀번호가 키스토어 비밀번호와 다르면 ANDROID_KEY_PASSWORD 비밀을 넣으세요."; exit 1 ;;
            *)        echo "::error::키 확인 프로그램이 결과를 내지 못했습니다."; exit 1 ;;
          esac
          KEY_ALIAS="$(printf '%s' "${CHECK}" | awk '{print $2}')"
          EXPECTED="$(printf '%s' "${CHECK}" | awk '{print $3}')"

          # app/build.gradle.kts 가 읽는 파일. git 에서 제외돼 있고 빌드 직후 지운다.
          # java.util.Properties 는 \ 를 이스케이프로, 앞 공백을 구분자로 보므로 값을 이스케이프해서 쓴다.
          prop() { printf '%s=%s\n' "$1" "$(printf '%s' "$2" | sed -e 's/\\/\\\\/g' -e 's/^[[:space:]]/\\&/')"; }
          {
            prop storeFile "${KS_PATH}"
            prop storePassword "${KEYSTORE_PASSWORD}"
            prop keyAlias "${KEY_ALIAS}"
            prop keyPassword "${KEY_PASSWORD}"
          } > keystore.properties
          echo "SIGNING=${SIGNING}" >> "${GITHUB_ENV}"
          echo "EXPECTED_CERT_SHA256=${EXPECTED}" >> "${GITHUB_ENV}"
          echo "서명 키 준비: ${SIGNING}, 별칭 ${KEY_ALIAS}, 인증서 SHA-256 ${EXPECTED}"

      - name: 단위 테스트 + assembleRelease
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # GitHub 표현식은 산술을 못 하므로 셸에서 계산한다
          VERSION_CODE=$((1000 + RUN_NUMBER))
          VERSION_NAME="1.0.${RUN_NUMBER}"
          echo "VERSION_CODE=${VERSION_CODE}" >> "${GITHUB_ENV}"
          echo "VERSION_NAME=${VERSION_NAME}" >> "${GITHUB_ENV}"
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest :app:assembleRelease \
            -PversionCode="${VERSION_CODE}" \
            -PversionName="${VERSION_NAME}" \
            --no-daemon --stacktrace

      - name: APK 정리 + 서명 확인 (${{ env.APK_NAME }})
        run: |
          set -euo pipefail
          rm -f keystore.properties
          OUT_DIR="app/build/outputs/apk/release"
          echo "빌드 산출물:"; ls -la "${OUT_DIR}"
          APK_SRC="${OUT_DIR}/app-release.apk"
          if [ ! -s "${APK_SRC}" ]; then
            echo "::error::${APK_SRC} 가 없습니다. 서명되지 않은 APK 만 나왔다면 keystore.properties 를 Gradle 이 못 읽은 것입니다."
            exit 1
          fi
          mkdir -p dist
          cp "${APK_SRC}" "dist/${APK_NAME}"

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(ls -d "${SDK}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "${APKSIGNER}" ]; then
            echo "::error::apksigner 를 찾지 못했습니다 (${SDK}/build-tools)."
            exit 1
          fi
          "${APKSIGNER}" verify --verbose --print-certs "dist/${APK_NAME}" > apksigner.txt
          cat apksigner.txt
          ACTUAL="$(grep -m1 'certificate SHA-256 digest' apksigner.txt | awk '{print $NF}' | tr 'A-F' 'a-f' || true)"
          rm -f apksigner.txt
          if [ -z "${ACTUAL}" ] || [ "${ACTUAL}" != "${EXPECTED_CERT_SHA256}" ]; then
            echo "::error::APK 서명 인증서(${ACTUAL:-없음})가 준비한 키(${EXPECTED_CERT_SHA256})와 다릅니다."
            exit 1
          fi
          echo "서명 확인: 준비한 키와 같음 (${SIGNING}, SHA-256 ${ACTUAL})"

          if [ "${SIGNING}" = "release" ]; then
            SIGNING_TEXT="고정 키 (Secrets). 같은 키로 깔린 FieldCam 위에는 덮어쓰기 설치됩니다."
          else
            SIGNING_TEXT="임시 키 (Secrets 미설정). 검증용이며 릴리스에는 올리지 않습니다."
          fi
          echo "SIGNING_TEXT=${SIGNING_TEXT}" >> "${GITHUB_ENV}"
          {
            echo "## FieldCam APK"
            echo ""
            echo "- 파일: \`${APK_NAME}\` ($(du -h "dist/${APK_NAME}" | cut -f1))"
            echo "- versionCode: ${VERSION_CODE}, versionName: ${VERSION_NAME}"
            echo "- 서명: ${SIGNING_TEXT}"
            echo "- 서명 인증서 SHA-256: \`${ACTUAL}\`"
            echo "- 커밋: ${GITHUB_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 아티팩트 업로드 (fieldcam-apk)
        uses: actions/upload-artifact@v4
        with:
          name: fieldcam-apk
          path: dist/${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30

      # ---- 아래는 main 브랜치일 때만 ----

      - name: 릴리스 게시 여부 확인
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${SIGNING}" != "release" ]; then
            {
              echo ""
              echo "### 릴리스를 갱신하지 않았습니다"
              echo "저장소 Secrets 에 서명 키가 없습니다. Settings → Secrets and variables → Actions 에"
              echo "ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD 를 넣고 Actions → Build Android APK → Run workflow 로 다시 실행하세요."
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "::error::저장소 Secrets 에 서명 키(ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD)가 없어 릴리스를 갱신하지 않았습니다. 넣은 뒤 Actions → Build Android APK → Run workflow 로 다시 실행하세요."
            exit 1
          fi
          # 예전 실행을 다시 돌려도 더 새 빌드를 낮은 버전으로 덮지 않는다 (폰에서 다운그레이드는 설치되지 않음)
          PUBLISHED="$(gh release view apk-latest --repo "${GITHUB_REPOSITORY}" --json body --jq .body 2>/dev/null \
            | grep -o 'versionCode [0-9]*' | head -n 1 | awk '{print $2}' || true)"
          if [ -n "${PUBLISHED}" ] && [ "${PUBLISHED}" -gt "${VERSION_CODE}" ]; then
            echo "::warning::릴리스에 더 새 빌드(versionCode ${PUBLISHED})가 있어 이 빌드(versionCode ${VERSION_CODE})는 게시하지 않습니다."
            echo "PUBLISH=false" >> "${GITHUB_ENV}"
          else
            echo "PUBLISH=true" >> "${GITHUB_ENV}"
          fi

      - name: 태그 apk-latest 를 현재 커밋으로 이동
        if: github.ref == 'refs/heads/main' && env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          git tag -f apk-latest "${GITHUB_SHA}"
          git push --force origin refs/tags/apk-latest

      - name: 릴리스 apk-latest 생성/갱신
        if: github.ref == 'refs/heads/main' && env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: FieldCam APK (최신)
          prerelease: false
          draft: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/${{ env.APK_NAME }}
          body: |
            main 브랜치 최신 빌드입니다. main 에 합칠 때마다 같은 태그(apk-latest)로 덮어써집니다.

            - 다운로드: https://github.com/${{ github.repository }}/releases/download/apk-latest/${{ env.APK_NAME }}
            - 앱 버전: v${{ env.VERSION_NAME }} (versionCode ${{ env.VERSION_CODE }}). 앱 설정 화면 오른쪽 위 번호와 같으면 최신입니다.
            - 서명: ${{ env.SIGNING_TEXT }}
            - 서명 인증서 SHA-256: ${{ env.EXPECTED_CERT_SHA256 }}
            - 커밋: ${{ github.sha }}
            - 빌드 로그: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            설치: 휴대폰에서 위 다운로드 링크를 열고, 다운로드 완료 알림에서 방금 받은 파일을 열어 설치하세요.
            같은 이름 파일이 있으면 브라우저가 fieldcam (1).apk 처럼 이름을 바꿔 저장합니다.
            "앱이 설치되지 않았습니다"가 뜨면 먼저 방금 받은 파일을 열었는지, 앱 설정 화면의 버전이 위 앱 버전보다 높지 않은지 확인하세요.
            PC 에서 깐 앱이 있거나 서명 키를 바꾼 경우에만 기존 FieldCam 을 지운 뒤 설치합니다. 지우면 설정한 이름이 모두 지워집니다.
